# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21
loader_version=0.19.5
loom_version=1.14-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.lege
archives_base_name=temp1792221464

# Dependencies
fabric_version=0.102.0+1.21

# 开发测试用模组（仅运行时加载，MC 1.21 线）
litematica_version=0.19.61
malilib_version=0.21.10

# 网络代理：走本地 Clash 混合端口(17890)，国内源按 Clash 规则 GeoIP CN 直连
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=17890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=17890
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1

# 调大网络超时与重试（默认读超时30秒，跨境Cloudflare停滞时会超时）
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.repository.max.tentatives=5